name: 'MailBrew Create Address'
description: 'Create a temporary MailBrew email address for E2E testing'
branding:
  icon: 'plus-circle'
  color: 'blue'

inputs:
  ttl:
    description: 'Address time-to-live in seconds'
    required: false
    default: '3600'

outputs:
  address:
    description: 'The created email address'
    value: ${{ steps.create.outputs.address }}

runs:
  using: 'composite'
  steps:
    - name: Create address
      id: create
      shell: bash
      env:
        MB_TTL: ${{ inputs.ttl }}
      run: |
        RESULT=$(mailbrew create-address --ttl "$MB_TTL")
        ADDRESS=$(printf '%s\n' "$RESULT" | awk '{print $1}')
        printf 'address=%s\n' "$ADDRESS" >> "$GITHUB_OUTPUT"
        echo "Created address: $ADDRESS"
