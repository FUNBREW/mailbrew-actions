name: 'MailBrew Setup'
description: 'Install MailBrew CLI and configure API key for E2E email testing'
branding:
  icon: 'mail'
  color: 'blue'

inputs:
  api-key:
    description: 'MailBrew API key'
    required: true
  base-url:
    description: 'MailBrew API base URL'
    required: false
    default: 'https://mailbrew.dev'
  version:
    description: 'CLI version to install'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install MailBrew CLI
      shell: bash
      run: npm install -g @mailbrew/cli@${{ inputs.version }}

    - name: Configure environment
      shell: bash
      run: |
        echo "MAILBREW_API_KEY=${{ inputs.api-key }}" >> $GITHUB_ENV
        echo "MAILBREW_BASE_URL=${{ inputs.base-url }}" >> $GITHUB_ENV

    - name: Verify installation
      shell: bash
      run: mailbrew --version
