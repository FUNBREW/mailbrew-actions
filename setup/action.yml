name: 'MailBrew Setup'
description: 'Install MailBrew CLI and configure API key for E2E email testing'
branding:
  icon: 'mail'
  color: 'blue'

inputs:
  api-key:
    description: 'MailBrew API key'
    required: true
  base-url:
    description: 'MailBrew API base URL'
    required: false
    default: 'https://mailbrew.dev'
  version:
    description: 'CLI version to install'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install MailBrew CLI
      shell: bash
      env:
        MB_VERSION: ${{ inputs.version }}
      run: npm install -g "@mailbrew/cli@${MB_VERSION}"

    # Inputs are passed through env, never interpolated into the script (script injection).
    - name: Configure environment
      shell: bash
      env:
        MB_API_KEY: ${{ inputs.api-key }}
        MB_BASE_URL: ${{ inputs.base-url }}
      run: |
        printf 'MAILBREW_API_KEY=%s\n' "$MB_API_KEY" >> "$GITHUB_ENV"
        printf 'MAILBREW_BASE_URL=%s\n' "$MB_BASE_URL" >> "$GITHUB_ENV"

    - name: Verify installation
      shell: bash
      run: mailbrew --version
