name: 'BrewMail Setup'
description: 'Install BrewMail CLI and configure API key for E2E email testing'
branding:
  icon: 'mail'
  color: 'blue'

inputs:
  api-key:
    description: 'BrewMail API key'
    required: true
  base-url:
    description: 'BrewMail API base URL'
    required: false
    default: 'https://brewmail.dev'
  version:
    description: 'CLI version to install'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install BrewMail CLI
      shell: bash
      run: npm install -g @brewmail/cli@${{ inputs.version }}

    - name: Configure environment
      shell: bash
      run: |
        echo "BREWMAIL_API_KEY=${{ inputs.api-key }}" >> $GITHUB_ENV
        echo "BREWMAIL_BASE_URL=${{ inputs.base-url }}" >> $GITHUB_ENV

    - name: Verify installation
      shell: bash
      run: mailbrew --version
