name: 'MailBrew Assert Email'
description: 'Wait for an email and assert its properties. Posts results to GitHub Job Summary.'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  address:
    description: 'MailBrew email address to check'
    required: true
  subject:
    description: 'Assert exact subject match'
    required: false
  subject-contains:
    description: 'Assert subject contains text'
    required: false
  from:
    description: 'Assert sender address'
    required: false
  to:
    description: 'Assert recipient address'
    required: false
  body-contains:
    description: 'Assert body contains text'
    required: false
  timeout:
    description: 'Wait timeout in seconds'
    required: false
    default: '30'

outputs:
  passed:
    description: 'Whether all assertions passed'
    value: ${{ steps.assert.outputs.passed }}
  result:
    description: 'Full assertion result JSON'
    value: ${{ steps.assert.outputs.result }}

runs:
  using: 'composite'
  steps:
    - name: Run email assertion
      id: assert
      shell: bash
      # Inputs are passed through env and built into an argument array, never eval'd (script injection).
      env:
        MB_ADDRESS: ${{ inputs.address }}
        MB_TIMEOUT: ${{ inputs.timeout }}
        MB_SUBJECT: ${{ inputs.subject }}
        MB_SUBJECT_CONTAINS: ${{ inputs.subject-contains }}
        MB_FROM: ${{ inputs.from }}
        MB_TO: ${{ inputs.to }}
        MB_BODY_CONTAINS: ${{ inputs.body-contains }}
      run: |
        ARGS=(assert "$MB_ADDRESS" --timeout "$MB_TIMEOUT")
        [ -n "$MB_SUBJECT" ] && ARGS+=(--subject "$MB_SUBJECT")
        [ -n "$MB_SUBJECT_CONTAINS" ] && ARGS+=(--subject-contains "$MB_SUBJECT_CONTAINS")
        [ -n "$MB_FROM" ] && ARGS+=(--from "$MB_FROM")
        [ -n "$MB_TO" ] && ARGS+=(--to "$MB_TO")
        [ -n "$MB_BODY_CONTAINS" ] && ARGS+=(--body-contains "$MB_BODY_CONTAINS")

        set +e
        RESULT=$(mailbrew "${ARGS[@]}" 2>&1)
        EXIT_CODE=$?
        set -e

        DELIM="MAILBREW_RESULT_$(date +%s%N)"
        {
          echo "result<<$DELIM"
          printf '%s\n' "$RESULT"
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"

        if [ $EXIT_CODE -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi

        # Write to Job Summary
        {
          echo "## MailBrew Email Assertion"
          echo ""
          if [ $EXIT_CODE -eq 0 ]; then
            echo ":white_check_mark: **PASSED**"
          else
            echo ":x: **FAILED**"
          fi
          echo ""
          echo '```'
          printf '%s\n' "$RESULT"
          echo '```'
          echo ""
          printf '**Address:** `%s`\n' "$MB_ADDRESS"
        } >> "$GITHUB_STEP_SUMMARY"

        exit $EXIT_CODE
